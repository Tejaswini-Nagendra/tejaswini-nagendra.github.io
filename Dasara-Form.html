
<!DOCTYPE html>
<html lang="en">

<head>
    <script src="d:\GitHub projects\scripts\Dasara.js"></script>
       
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mysore Dasara - Ticket Booking</title>
    <style>
        body {
            margin: 0;
            background: #fff;
            display: flex;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .phone {
            width: 700px;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url("d:/GitHub projects/Images/dasara_image4.jpg");
            border-radius: 35px;
            margin: 20px;
            padding-bottom: 25px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            border: 4px solid #222;
        }

        .header {
            background: #b8860b;
            margin: 15px;
            border-radius: 15px;
            padding: 14px;
            display: flex;
            align-items: center;
            color: black;
            border: 1.5px solid #fde68a;
        }

        .header h1 {
            margin: 0 auto;
            font-size: 28px;
            font-family: serif;
        }

        .pattern {
            color: #d4a76a;
            text-align: center;
            letter-spacing: 4px;
            font-size: 14px;
            margin: 5px 0;
        }

        .sub-title {
            color: #fde68a;
            text-align: center;
            font-size: 12px;
            opacity: 0.8;
        }

        .form-card {
            background: rgba(255, 255, 255, 0.92);
            margin: 15px;
            border-radius: 22px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .form-card h2 {
            text-align: center;
            color: #b8860b;
            margin: 0;
            font-family: serif;
            font-size: 26px;
        }

        .icon-title {
            text-align: center;
            font-size: 28px;
        }

        label {
            display: block;
            margin: 18px 0 6px;
            font-weight: 600;
            color: #b8860b;
            font-size: 14px;
        }

        .input-box {
            width: 100%;
            padding: 13px 12px;
            border: 1.5px solid #c9a86a;
            border-radius: 10px;
            font-size: 14px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            background: white;
        }

        .input-box input,
        .input-box select {
            border: none;
            outline: none;
            width: 100%;
            margin-left: 10px;
            font-size: 14px;
        }

        .ticket-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .qty {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .qty button {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            background: #e8d5a3;
            font-size: 18px;
            cursor: pointer;
        }

        .price {
            font-size: 12px;
            border-left: 1px solid #ccc;
            padding-left: 10px;
        }

        .book-btn {
            background: #b8860b;
            color: black;
            width: calc(100% - 30px);
            margin: 15px;
            padding: 16px;
            border-radius: 30px;
            border: 1.5px solid #fde68a;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

    </style>
</head>

<body>

    <div class="phone">
        <div class="header">
            <span style="font-size:24px;">←</span>
            <h1>Ticket Booking</h1>
        </div>
        <div class="pattern">●●●●●●●●●●●●●●●●●●●●●●●●</div>
        <div class="sub-title">Mysore Dasara 2026 • Palace Illumination Event</div>

        <div class="form-card">
            <div class="icon-title"></div>
            <h2>Book Your Tickets</h2>

            <form id="dasaraForm">
                <label>Full Name •</label>
                <div class="input-box"> <input type="text" id="name" placeholder="Enter your full name" required></div>

                <label>Phone Number •</label>
                <div class="input-box"> <input type="tel" id="phone" value="+91 " required></div>

                <label>Email ID •</label>
                <div class="input-box">✉️ <input type="email" id="email" placeholder="your.email@example.com" required>
                </div>

                <label>Select Event •</label>
                <div class="input-box"><select id="event">
                        <option>Mysore Dasara 2026 — Palace Illumination & Cultural Show</option>
                        <option>Yuva Dasara</option>
                        <option>Dasara Flower Show</option>
                        <option>Aahara Mela(Food Festival)</option>
                        <option>Dasara Exhibition</option>
                        <option>Darasa Wrestling(Kusti Spardhe)</option>
                        <option>Heritage Walk/Cycling/Tonga Ride</option>
                        <option>Yuva Sambhrama & Kavi Goshti</option>
                        <option>Torchlinght Parade(Finale)</option>
                    </select></div>

                <label>Select Date •</label>
                <div class="input-box"><input type="date" id="date" value="2026-10-07" required> </div>

                <label>Number of Tickets •</label>
                <div class="input-box ticket-row">
                    <div class="qty"><button type="button" onclick="changeQty(-1)">-</button><b id="qty">2</b><button
                            type="button" onclick="changeQty(1)">+</button></div>
                    <div class="price">₹100 per ticket • Total: <b id="total">₹200</b></div>
                </div>
            </form>
        </div>

        <button class="book-btn" onclick="book()">️ Pay Now</button>
    </div>

        let q = 2;
        function changeQty(d) { q = Math.max(1, q + d); document.getElementById('qty').innerText = q; document.getElementById('total').innerText = '₹' + (q * 100); }
        function book() {
            let data = { name: document.getElementById('name').value, phone: document.getElementById('phone').value, email: document.getElementById('email').value, event: document.getElementById('event').value, date: document.getElementById('date').value, tickets: q, id: 'MYS' + Math.floor(100000 + Math.random() * 900000) };
            localStorage.setItem('dasaraBooking', JSON.stringify(data));
            window.location.href = 'Output.html';
        }
    </script>-->
</body>

</html>
